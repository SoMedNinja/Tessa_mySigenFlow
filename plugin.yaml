# Entity inputs are screen-level settings on Tessera versions before per-tile entity options.
# Safe fallback lets existing screens build before the new optional SoC input is selected.
defaults: { BATTERY_SOC_ENTITY: sensor.unconfigured_battery_soc }
tessa_my_sigen_flow:
  id: sigen_flow

sensor:
  - platform: homeassistant
    id: sigen_energy_price
    entity_id: ${PRICE_ENTITY}
    unit_of_measurement: SEK/kWh
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_price(x);
  - platform: homeassistant
    id: sigen_battery_soc
    entity_id: ${BATTERY_SOC_ENTITY}
    unit_of_measurement: "%"
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_battery_soc(x);
  - platform: homeassistant
    id: sigen_solar_power
    entity_id: ${SOLAR_ENTITY}
    unit_of_measurement: W
    internal: true
    on_value:
      - lambda: |-
          const char *entities[5] = {"${SOLAR_ENTITY}", "${BATTERY_ENTITY}", "${GRID_ENTITY}", "${HOME_ENTITY}", "${CAR_ENTITY}"};
          id(sigen_flow).update_sensor(0, x, entities, tessera::epoch());
  - platform: homeassistant
    id: sigen_battery_power
    entity_id: ${BATTERY_ENTITY}
    unit_of_measurement: W
    internal: true
    on_value:
      - lambda: |-
          const char *entities[5] = {"${SOLAR_ENTITY}", "${BATTERY_ENTITY}", "${GRID_ENTITY}", "${HOME_ENTITY}", "${CAR_ENTITY}"};
          id(sigen_flow).update_sensor(1, x, entities, tessera::epoch());
  - platform: homeassistant
    id: sigen_grid_power
    entity_id: ${GRID_ENTITY}
    unit_of_measurement: W
    internal: true
    on_value:
      - lambda: |-
          const char *entities[5] = {"${SOLAR_ENTITY}", "${BATTERY_ENTITY}", "${GRID_ENTITY}", "${HOME_ENTITY}", "${CAR_ENTITY}"};
          id(sigen_flow).update_sensor(2, x, entities, tessera::epoch());
  - platform: homeassistant
    id: sigen_home_power
    entity_id: ${HOME_ENTITY}
    unit_of_measurement: W
    internal: true
    on_value:
      - lambda: |-
          const char *entities[5] = {"${SOLAR_ENTITY}", "${BATTERY_ENTITY}", "${GRID_ENTITY}", "${HOME_ENTITY}", "${CAR_ENTITY}"};
          id(sigen_flow).update_sensor(3, x, entities, tessera::epoch());
  - platform: homeassistant
    id: sigen_car_power
    entity_id: ${CAR_ENTITY}
    unit_of_measurement: W
    internal: true
    on_value:
      - lambda: |-
          const char *entities[5] = {"${SOLAR_ENTITY}", "${BATTERY_ENTITY}", "${GRID_ENTITY}", "${HOME_ENTITY}", "${CAR_ENTITY}"};
          id(sigen_flow).update_sensor(4, x, entities, tessera::epoch());

text_sensor:
  - platform: homeassistant
    id: sigen_solar_unit
    entity_id: ${SOLAR_ENTITY}
    attribute: unit_of_measurement
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_unit(0, x.c_str());
  - platform: homeassistant
    id: sigen_battery_unit
    entity_id: ${BATTERY_ENTITY}
    attribute: unit_of_measurement
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_unit(1, x.c_str());
  - platform: homeassistant
    id: sigen_grid_unit
    entity_id: ${GRID_ENTITY}
    attribute: unit_of_measurement
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_unit(2, x.c_str());
  - platform: homeassistant
    id: sigen_home_unit
    entity_id: ${HOME_ENTITY}
    attribute: unit_of_measurement
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_unit(3, x.c_str());
  - platform: homeassistant
    id: sigen_car_unit
    entity_id: ${CAR_ENTITY}
    attribute: unit_of_measurement
    internal: true
    on_value:
      - lambda: |-
          id(sigen_flow).update_unit(4, x.c_str());
